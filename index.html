<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAZZI — Marketplace de Aulas de Direção</title>
    <meta name="description" content="Encontre, reserve e pague aulas práticas de direção em São Paulo." />
    <meta name="theme-color" content="#F9C93D" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="/brand/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/pwa/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MAZZI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="MAZZI — Marketplace de Aulas de Direção" />
    <meta property="og:description" content="Encontre, reserve e pague aulas práticas de direção em São Paulo." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="mazzi-initial-splash" role="status" aria-label="Carregando MAZZI">
      <div id="mazzi-default-splash">
        <picture>
          <source media="(prefers-reduced-motion: reduce)" srcset="/brand/mazzi-logo.png" />
          <img src="/brand/mazzi-road-motion.gif" alt="" width="128" height="128" fetchpriority="high" />
        </picture>
      </div>
      <div id="mazzi-payment-return-splash" hidden aria-label="Carregando pagamento">
        <img src="/brand/mazzi-road-motion.gif" alt="" width="112" height="112" fetchpriority="high" />
        <p class="mazzi-payment-kicker">MAZZI</p>
        <h1>Carregando pagamento</h1>
        <p>Aguarde enquanto abrimos o resultado do seu pagamento.</p>
      </div>
    </div>
    <div id="root"></div>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }
      #mazzi-initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f9c93d;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity 180ms ease;
      }
      #mazzi-initial-splash.is-ready {
        opacity: 0;
        pointer-events: none;
      }
      #mazzi-initial-splash.checkout-return {
        background: #f8f6f1;
      }
      #mazzi-initial-splash img {
        display: block;
        width: 128px;
        height: 128px;
        object-fit: cover;
      }
      #mazzi-payment-return-splash {
        width: min(100%, 420px);
        padding: 24px;
        color: #20232b;
        text-align: center;
      }
      #mazzi-payment-return-splash img {
        width: 112px;
        height: 112px;
        margin: 0 auto 20px;
      }
      #mazzi-payment-return-splash .mazzi-payment-kicker {
        margin: 0;
        color: #77736c;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #mazzi-payment-return-splash h1 {
        margin: 4px 0 8px;
        color: #20232b;
        font-size: 20px;
        line-height: 1.2;
      }
      #mazzi-payment-return-splash > p:last-child {
        max-width: 320px;
        margin: 0 auto;
        color: #77736c;
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const isStripeReturn = params.get('stripe_checkout') === 'success' && params.has('payment_id');
        if (!isStripeReturn) return;

        const splash = document.getElementById('mazzi-initial-splash');
        const defaultSplash = document.getElementById('mazzi-default-splash');
        const paymentSplash = document.getElementById('mazzi-payment-return-splash');
        if (!splash || !defaultSplash || !paymentSplash) return;

        splash.classList.add('checkout-return');
        defaultSplash.hidden = true;
        paymentSplash.hidden = false;
        splash.setAttribute('aria-label', 'Carregando pagamento');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
