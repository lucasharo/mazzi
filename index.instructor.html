<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F9C93D" />
    <meta name="description" content="MAZZI — gestão profissional de aulas de direção." />
    <link rel="manifest" href="/manifest.instructor.webmanifest" />
    <link rel="icon" type="image/x-icon" href="/brand/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon/favicon-64x64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/pwa/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MAZZI PRO" />
    <title>MAZZI PRO</title>
    <script>
      if (window.Capacitor?.isNativePlatform?.()) document.documentElement.classList.add('native-shell');
    </script>
    <style>
      html, body, #root { width: 100%; min-height: 100%; margin: 0; }
      #mazzi-initial-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; min-height: 100dvh; background: #F9C93D; transition: opacity 180ms ease; }
      #mazzi-initial-splash.is-ready { opacity: 0; pointer-events: none; }
      #mazzi-initial-splash img { display: block; width: 128px; height: 128px; object-fit: cover; }
      html.native-shell #mazzi-initial-splash { display: none; }
    </style>
  </head>
  <body>
    <div id="mazzi-initial-splash" role="status" aria-label="Carregando MAZZI"><img src="/brand/mazzi-road-motion.gif" alt="" width="128" height="128" fetchpriority="high" /></div>
    <div id="root"></div>
    <script type="module" src="/src/entrypoints/instructor/main.tsx"></script>
  </body>
</html>
