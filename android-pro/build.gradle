// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Capacitor Camera currently emits a harmless compiler diagnostic in its
// bundled Kotlin source. Keep third-party warnings from obscuring actionable
// warnings in the MAZZI modules; compilation failures still fail the build.
subprojects {
    tasks.configureEach {
        if (name ==~ /compile.*Kotlin/) {
            kotlinOptions { suppressWarnings = true }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
