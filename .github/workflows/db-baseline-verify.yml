name: MAZZI Database Baseline Verify

on:
  workflow_dispatch:
  push:
    branches:
      - feature/premium-ui-v2
    paths:
      - '.github/workflows/db-baseline-verify.yml'
      - 'supabase/migrations/**'
      - 'scripts/database/**'

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_CLI_VERSION: 2.115.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify container runtime
        run: |
          docker --version
          docker info

      - name: Verify Supabase CLI
        run: npx --yes supabase@${SUPABASE_CLI_VERSION} --version

      - name: Collect DML inventory
        run: |
          mkdir -p artifacts
          grep -R -n -E -i '\b(insert|update|delete|merge|copy)\b' supabase/migrations > artifacts/dml-matches.txt || true
          DML_COUNT=$(wc -l < artifacts/dml-matches.txt)
          test "$DML_COUNT" -gt 0 || { echo DML_INVENTORY_INVALID_ZERO_MATCHES; exit 1; }
          grep -q '20260815000013_chat_reviews_notifications.sql' artifacts/dml-matches.txt || { echo DML_INVENTORY_SANITY_FILE_MISSING; exit 1; }
          { cat artifacts/dml-matches.txt; echo "DML_MATCHES=$DML_COUNT"; } > artifacts/dml-inventory.txt

      - name: Collect forward-reference inventory
        run: |
          mkdir -p artifacts
          grep -R -n -E -i 'alter function public\.|revoke .*on function public\.|grant .*on function public\.|comment on function public\.|drop function|alter table public\.|alter type|alter policy|drop policy|alter trigger' supabase/migrations > artifacts/historical-reference-candidates.txt || true
          test -s artifacts/historical-reference-candidates.txt || { echo HISTORICAL_REFERENCE_INVENTORY_INVALID; exit 1; }
          cat > artifacts/historical-forward-references.txt <<'EOF'
          20260815000015_sprint15_security_hardening.sql | public.get_provider_booking_context_public(uuid) | 20260818000051_harden_category_b_booking_funnel.sql | guard-if-exists
          20260815000015_sprint15_security_hardening.sql | public.is_offering_slot_available(uuid,timestamptz) | 20260818000040_restore_slot_contract_and_readonly_availability.sql | guard-if-exists
          EOF
          cat > artifacts/historical-compatibility-ledger.txt <<'EOF'
          20260815000015 | forward-reference | booking context | guard-if-exists
          20260815000015 | forward-reference | slot helper | guard-if-exists
          20260816000021 | syntax | meeting-point RPC | close missing parenthesis
          20260818000032 | replay-ledger | supabase_migrations.schema_migrations | omit redundant ledger DML managed by runner
          20260818000033 | replay-ledger | supabase_migrations.schema_migrations | omit redundant ledger DML managed by runner
          EOF

      - name: Prepare isolated replay workspace
        run: |
          rm -rf /tmp/mazzi-historical-replay
          cp -a . /tmp/mazzi-historical-replay
          node scripts/database/prepare-historical-replay.mjs /tmp/mazzi-historical-replay | tee artifacts/replay-compatibility.json

      - name: Replay compatible historical migrations
        run: |
          set -o pipefail
          cd /tmp/mazzi-historical-replay
          npx --yes supabase@${SUPABASE_CLI_VERSION} start 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/historical-replay.log"
          npx --yes supabase@${SUPABASE_CLI_VERSION} db reset 2>&1 | tee -a "$GITHUB_WORKSPACE/artifacts/historical-replay.log"

      - name: Capture original schema contract
        run: |
          mkdir -p artifacts/original
          cd /tmp/mazzi-historical-replay
          npx --yes supabase@${SUPABASE_CLI_VERSION} db dump --local --schema public --file "$GITHUB_WORKSPACE/artifacts/original/public-schema.sql"
          test -s "$GITHUB_WORKSPACE/artifacts/original/public-schema.sql"
          ( cd "$GITHUB_WORKSPACE/artifacts/original" && sha256sum public-schema.sql > public-schema.sha256 && sha256sum -c public-schema.sha256 )

      - name: Collect object inventory
        run: |
          cat > /tmp/object-inventory.sql <<'SQL'
          select 'public_tables' as metric, count(*)::text as value from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r'
          union all select 'public_columns', count(*)::text from information_schema.columns where table_schema='public'
          union all select 'constraints', count(*)::text from pg_constraint c join pg_namespace n on n.oid=c.connamespace where n.nspname='public'
          union all select 'indexes', count(*)::text from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='i'
          union all select 'functions', count(*)::text from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'
          union all select 'security_definer_functions', count(*)::text from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.prosecdef
          union all select 'triggers', count(*)::text from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and not t.tgisinternal
          union all select 'rls_tables', count(*)::text from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relrowsecurity
          union all select 'policies', count(*)::text from pg_policies where schemaname='public';
          SQL
          cd /tmp/mazzi-historical-replay
          npx --yes supabase@${SUPABASE_CLI_VERSION} db query --local --file /tmp/object-inventory.sql > "$GITHUB_WORKSPACE/artifacts/object-inventory.txt"
          for signature in \
            'get_provider_booking_context_public(uuid)' \
            'is_offering_slot_available(uuid,timestamptz)' \
            'create_booking_hold_at_meeting_point(uuid,uuid,character varying,jsonb)'; do
            npx --yes supabase@${SUPABASE_CLI_VERSION} db query --local "select p.oid::regprocedure, p.prosecdef, p.proconfig, coalesce(p.proacl::text,'') from pg_proc p where p.oid = '$signature'::regprocedure;" >> "$GITHUB_WORKSPACE/artifacts/object-inventory.txt"
          done

      - name: Generate squash in isolated workspace
        run: |
          cp -a /tmp/mazzi-historical-replay /tmp/mazzi-baseline-workspace
          cd /tmp/mazzi-baseline-workspace
          npx --yes supabase@${SUPABASE_CLI_VERSION} migration squash --local --version 20260824130725
          mkdir -p "$GITHUB_WORKSPACE/artifacts/squash"
          cp supabase/migrations/*.sql "$GITHUB_WORKSPACE/artifacts/squash/"
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mazzi-mvp-baseline-evidence
          path: artifacts/
