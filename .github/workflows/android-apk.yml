name: MAZZI Android APK

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MAZZI Aluno APK
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_GEOAPIFY_API_KEY: ${{ secrets.VITE_GEOAPIFY_API_KEY }}
      VITE_APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      VITE_PAYMENT_GATEWAY_PROVIDER: stripe
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || secrets.STRIPE_PUBLISHABLE_KEY }}
      VITE_ENABLE_DEV_QUICK_LOGIN: 'false'
      VITE_FIREBASE_API_KEY: ${{ github.ref == 'refs/heads/feature/premium-ui-v2' && secrets.VITE_FIREBASE_API_KEY || '' }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ github.ref == 'refs/heads/feature/premium-ui-v2' && secrets.VITE_FIREBASE_AUTH_DOMAIN || '' }}
      VITE_FIREBASE_PROJECT_ID: ${{ github.ref == 'refs/heads/feature/premium-ui-v2' && secrets.VITE_FIREBASE_PROJECT_ID || '' }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ github.ref == 'refs/heads/feature/premium-ui-v2' && secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '' }}
      VITE_FIREBASE_APP_ID: ${{ github.ref == 'refs/heads/feature/premium-ui-v2' && secrets.VITE_FIREBASE_APP_ID || '' }}
      VITE_FCM_VAPID_KEY: ${{ github.ref == 'refs/heads/feature/premium-ui-v2' && secrets.VITE_FCM_VAPID_KEY || '' }}
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install web dependencies
        run: npm install --os=linux --cpu=x64 || npm install

      - name: Configure Firebase Android client
        if: ${{ env.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64 != '' }}
        shell: bash
        run: echo "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json

      - name: Build and sync Android web assets
        run: npm run cap:sync:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mazzi-aluno-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
