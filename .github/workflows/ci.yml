name: MAZZI CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test, Build & Environment Deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --os=linux --cpu=x64 || npm install

      - name: Run Typecheck & Linter (npm run lint)
        run: npm run lint

      - name: Run Unit & Integration Test Suite (npm test)
        run: npm test

      - name: Validate Multi-App Build (npm run build:all)
        env:
          VITE_GEOAPIFY_API_KEY: ${{ secrets.VITE_GEOAPIFY_API_KEY }}
          VITE_PAYMENT_MODE: MOCK_VALIDATION
          VITE_PAYMENT_GATEWAY_PROVIDER: fake
          VITE_ENABLE_DEV_QUICK_LOGIN: 'false'
        run: npm run build:all

      - name: Deploy DEV apps to Cloudflare Pages
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feature/premium-ui-v2' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::notice::Cloudflare DEV deploy skipped: CLOUDFLARE_ACCOUNT_ID/CLOUDFLARE_API_TOKEN not configured."
            exit 0
          fi

          retry() {
            local max_attempts="$1"
            shift
            local attempt=1

            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "::error::Cloudflare command failed after ${max_attempts} attempts: $*" >&2
                return 1
              fi

              local delay=$((attempt * 5))
              echo "::warning::Cloudflare command failed (${attempt}/${max_attempts}); retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          ensure_project() {
            local project="$1"
            local output
            local status

            for attempt in 1 2 3; do
              echo "Ensuring Cloudflare Pages project: ${project} (attempt ${attempt}/3)"

              set +e
              output=$(npx --yes wrangler@4 pages project create "$project" \
                --production-branch="feature/premium-ui-v2" 2>&1)
              status=$?
              set -e

              echo "$output"

              if (( status == 0 )); then
                return 0
              fi

              # Cloudflare code 8000002 means the project already exists.
              # That is the desired idempotent state for subsequent deploys.
              if grep -qE 'code: 8000002|project with this name already exists' <<<"$output"; then
                echo "Cloudflare Pages project already exists: ${project}"
                return 0
              fi

              if (( attempt < 3 )); then
                local delay=$((attempt * 5))
                echo "::warning::Cloudflare project creation failed for ${project}; retrying in ${delay}s..." >&2
                sleep "$delay"
              fi
            done

            echo "::error::Unable to ensure Cloudflare Pages project after 3 attempts: ${project}" >&2
            return 1
          }

          PROJECTS=(
            "mazzi-aluno-dev:dist/student"
            "mazzi-profissional-dev:dist/instructor"
            "mazzi-admin-dev:dist/admin"
          )

          deploy_failed=0

          for entry in "${PROJECTS[@]}"; do
            project="${entry%%:*}"
            directory="${entry#*:}"

            if ! ensure_project "$project"; then
              echo "::error::Skipping deploy because project could not be ensured: ${project}" >&2
              deploy_failed=1
              continue
            fi

            echo "Deploying ${project} from ${directory}"
            if ! retry 3 npx --yes wrangler@4 pages deploy "$directory" \
              --project-name="$project" \
              --branch="feature/premium-ui-v2" \
              --commit-hash="$GITHUB_SHA" \
              --commit-message="MAZZI DEV deploy"; then
              deploy_failed=1
            fi
          done

          if (( deploy_failed != 0 )); then
            echo "::error::One or more Cloudflare DEV deployments failed." >&2
            exit 1
          fi
