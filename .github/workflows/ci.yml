name: MAZZI CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test, Build & DEV Deploy
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --os=linux --cpu=x64 || npm install

      - name: Run Typecheck & Linter (npm run lint)
        run: npm run lint

      - name: Run Unit & Integration Test Suite (npm test)
        run: npm test

      - name: Validate Multi-App DEV Build (npm run build:all)
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GEOAPIFY_API_KEY: ${{ secrets.VITE_GEOAPIFY_API_KEY }}
          VITE_PAYMENT_MODE: MOCK_VALIDATION
          VITE_PAYMENT_GATEWAY_PROVIDER: fake
          VITE_ENABLE_DEV_QUICK_LOGIN: 'false'
        run: npm run build:all

      - name: Deploy DEV apps to Cloudflare Pages
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feature/premium-ui-v2' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::notice::Cloudflare DEV deploy skipped: CLOUDFLARE_ACCOUNT_ID/CLOUDFLARE_API_TOKEN not configured."
            exit 0
          fi

          retry() {
            local max_attempts="$1"
            shift
            local attempt=1

            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "::error::Cloudflare command failed after ${max_attempts} attempts: $*" >&2
                return 1
              fi

              local delay=$((attempt * 5))
              echo "::warning::Cloudflare command failed (${attempt}/${max_attempts}); retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          refresh_projects() {
            retry 3 npx --yes wrangler@4 pages project list --json > /tmp/cloudflare-pages-projects.json
          }

          project_exists() {
            local project="$1"
            jq -e --arg project "$project" '.[] | select(.name == $project)' /tmp/cloudflare-pages-projects.json >/dev/null
          }

          ensure_project() {
            local project="$1"

            refresh_projects
            if project_exists "$project"; then
              echo "Cloudflare Pages project already exists: ${project}"
              return 0
            fi

            for attempt in 1 2 3; do
              echo "Creating Cloudflare Pages project: ${project} (attempt ${attempt}/3)"
              if npx --yes wrangler@4 pages project create "$project" \
                --production-branch="feature/premium-ui-v2"; then
                return 0
              fi

              # A transient API error can happen after Cloudflare has already
              # accepted the creation. Re-check before trying to create again.
              sleep $((attempt * 5))
              if refresh_projects && project_exists "$project"; then
                echo "Cloudflare Pages project exists after transient create error: ${project}"
                return 0
              fi
            done

            echo "::error::Unable to create Cloudflare Pages project after 3 attempts: ${project}" >&2
            return 1
          }

          PROJECTS=(
            "mazzi-aluno:dist/student"
            "mazzi-pro:dist/instructor"
            "mazzi-admin:dist/admin"
          )

          for entry in "${PROJECTS[@]}"; do
            project="${entry%%:*}"
            directory="${entry#*:}"

            ensure_project "$project"

            echo "Deploying ${project} from ${directory}"
            retry 3 npx --yes wrangler@4 pages deploy "$directory" \
              --project-name="$project" \
              --branch="feature/premium-ui-v2" \
              --commit-hash="$GITHUB_SHA" \
              --commit-message="MAZZI DEV deploy"
          done
